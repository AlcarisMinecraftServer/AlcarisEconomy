version: 1

currency:
  defaultBalance: 10000
  createAccountOnJoin: true
  format:
    singularMajor: "円"
    pluralMajor: "円"
    format: "{major}円"

cash_item:
  server_key: "CHANGE_THIS_TO_ANY_FIXED_STRING"
  denominations:
    - amount: 100
      material: PAPER
      custom_model_data: 1001
      display_name: "&f&l百円札"
      lore:
        - "&7サーバー内通貨"
        - "&e額面: &f100円"
        - "&8[ 正規発行券 ]"
      glint: false
    - amount: 1000
      material: PAPER
      custom_model_data: 1002
      display_name: "&a&l千円札"
      lore:
        - "&7サーバー内通貨"
        - "&e額面: &f1,000円"
        - "&8[ 正規発行券 ]"
      glint: false
    - amount: 10000
      material: PAPER
      custom_model_data: 1003
      display_name: "&6&l壱万円札"
      lore:
        - "&7サーバー内通貨"
        - "&e額面: &f10,000円"
        - "&8[ 正規発行券 ]"
      glint: false
    - amount: 100000
      material: PAPER
      custom_model_data: 1004
      display_name: "&b&l十万円札"
      lore:
        - "&7サーバー内通貨"
        - "&e額面: &f100,000円"
        - "&8[ 正規発行券 ]"
      glint: true

treasury:
  routing:
    transfer_fee: "general"
    freeze_fee: "general"
    crypto_fee: "general"
  initial:
    - key: "general"
      description: "一般国庫 - 各種手数料・税収の集約先"

lazyWrite: true

transfer:
  remote:
    rate: 0.03
    flat: 50
    minimum: 50
    maximum: 5000
  atm:
    flat: 100

freeze:
  inactive_days: 30
  warning_days_before: 7
  unfreeze_fee: 500

interest:
  enabled: true
  base_rate: 0.005
  max_amount: 10000
  apply_day: MONDAY
  apply_hour: 0
  activity:
    combat_per_kill: 2
    combat_weekly_cap: 100
    mining_per_block: 1
    mining_weekly_cap: 200
    minigame_per_join: 10
    minigame_weekly_cap: 100
    chat_per_message: 1
    chat_weekly_cap: 50
    chat_cooldown_seconds: 60
    total_weekly_cap: 300
  mining_blocks:
    - DIAMOND_ORE
    - DEEPSLATE_DIAMOND_ORE
    - IRON_ORE
    - DEEPSLATE_IRON_ORE
    - GOLD_ORE
    - DEEPSLATE_GOLD_ORE
    - COAL_ORE
    - DEEPSLATE_COAL_ORE
    - OAK_LOG
    - BIRCH_LOG
    - WHEAT

crypto:
  enabled: true
  fee_rate: 0.02
  rate_update_interval: 3600
  history_retention_hours: 168
  assets:
    - symbol: "SMC"
      display_name: "スモコイン"
      initial_rate: 1000
      volatility: 0.03
      max_rate: 10000
      min_rate: 100
      clustering_factor: 2.0
      clustering_lookback: 10
    - symbol: "DGD"
      display_name: "ダイヤゴールド"
      initial_rate: 5000
      volatility: 0.05
      max_rate: 50000
      min_rate: 500
      clustering_factor: 2.5
      clustering_lookback: 10
  engine:
    trend:
      bull_bias: 0.62
      bear_bias: 0.38
      reversal_chance: 0.05
      neutral_reversal: 0.10
      max_duration_hours: 72
      reversal_shock: 1.75
    bubble:
      enabled: true
      lookback_ticks: 30
      overheat_threshold: 1.50
      overcool_threshold: -0.60
      crash_first_drop_min: 0.20
      crash_first_drop_max: 0.35
      aftershock_count: 3
      recovery_hours_min: 6
      recovery_hours_max: 24
    impact:
      coefficient: 0.3
      immediate_threshold: 0.05
      large_threshold: 0.15
      large_trade_announce: true
    spread:
      base: 0.02
      min: 0.005
      max: 0.10
    spillover:
      enabled: true
      ratio: 0.25
      threshold: 0.10
    economy_index:
      enabled: true
      max_correction: 0.03
      transfer_weight: 1.0
      online_weight: 0.5
      freeze_weight: 0.5
      treasury_stability_threshold: 1000000
      treasury_stability_factor: 0.9

cheque:
  enabled: true
  min_amount: 1
  max_amount: 1000000
  max_note_length: 50
  custom_model_data: 2001

loan:
  player:
    enabled: true
    max_duration_days: 180
    collateral_accept_timeout: 60
    overdue_interest_rate: 0.005
    overdue_interest_cap: 3.0
    note_custom_model_data: 3001
  server:
    enabled: true
    borrow_limit: 500000
    borrow_limit_multiplier: 2.0
    daily_interest_rate: 0.003
    overdue_1_days: 7
    overdue_1_rate: 0.005
    overdue_2_days: 14
    overdue_2_rate: 0.010
    treasury_key: "general"
